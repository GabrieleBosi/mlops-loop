name: ci

on:
  push:
  pull_request:
  schedule:
    # Mondays 04:17 UTC. The dataset is fetched from a URL that can change under us, and the
    # sweep is deterministic, so a weekly run that goes red means the world moved, not the
    # code. GitHub only runs scheduled workflows on the default branch.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  loop:
    name: reproduce and gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # mlflow.db and mlruns/ are gitignored, so the runner starts with no registry at all.
      # That is the point: `reproduce` runs skeleton, train, eval, drift, reports and the gate
      # again, so every push proves the whole loop still works from nothing but this commit and
      # the dataset URL. It exits non-zero if the gate fails, which is what makes CI a gate.
      - name: Reproduce the whole loop
        run: python -m mlops_loop reproduce

      - name: Upload the generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: warn
