[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-loop"
version = "0.1.0"
description = "One tabular churn model through the full MLflow lifecycle."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["mlops_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` does not put the repo root on sys.path the way `python -m pytest` does.
# Without this the suite passes locally and fails in CI, which is how it was found.
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
