# The gate. `python -m mlops_loop eval` loads models:/churn@champion, scores the fixed
# holdout, and exits 1 if any line here fails.
#
# The gate is a regression gate against the incumbent, not a target chosen to be reachable.
# The tolerance rule below was fixed in the first version of this file, before any Session 2
# sweep existed (commit 10355c4), and has not changed since:
#
#   0.02 absolute for the two AUCs
#   0.05 absolute for recall at precision 0.5, because it moves in coarse steps
#   20 % relative for Brier, because a calibration regression matters proportionally
#
# What did change is the baseline the rule is applied to, and it is worth being exact about
# why. The first version applied the rule to run ae4f0cd88d4b4d439bbcadb545bd01b6. Session 2
# then found a defect in the split: `val` was drawn from the reference pool, which holds no
# fibre-optic customer, while the holdout is 43.6 % fibre, so validation scored every
# candidate on a sub-population the champion does not serve. Fixing that changed which rows
# a model trains on, so ae4f0cd8's numbers stopped being a like-for-like comparison. The
# holdout itself is drawn first and is byte-identical across the change: the same 1,057
# customers, before and after.
#
# Baseline: run 6903c40b712c4f288f959a48b1aa6589, `python -m mlops_loop skeleton` on the
# corrected split. That is the same incumbent configuration Session 1 shipped and registered
# (LogisticRegression, C=1.0, lbfgs, class_weight null, from configs/skeleton.yaml), fitted
# on the 2,674-row reference train split and scored on the 1,057-row holdout:
#
#   holdout_roc_auc 0.7899   holdout_pr_auc 0.5364
#   holdout_recall_at_precision_50 0.6464   holdout_brier 0.1651
#
# Honest note on ordering: exploratory measurements of candidate configs had already been
# taken when this file was rewritten, so "written before the results existed" no longer
# holds the way it did for the first version. What protects it instead is that the rule was
# fixed first and applied mechanically, and that the baseline is the incumbent rather than
# any sweep winner. Both versions of this file are in the git history.

split: holdout

metrics:
  # 0.7899 - 0.02. Ranking quality. Below this the champion is worse than the model the
  # repo already shipped.
  holdout_roc_auc:
    direction: higher_is_better
    threshold: 0.7699

  # 0.5364 - 0.02. The selection metric on val, so the holdout number is what says selection
  # generalised rather than fitted the validation split.
  holdout_pr_auc:
    direction: higher_is_better
    threshold: 0.5164

  # 0.6464 - 0.05. The operational number: how many churners are caught when at least half
  # of the flagged customers must really be churning.
  holdout_recall_at_precision_50:
    direction: higher_is_better
    threshold: 0.5964

  # 0.1651 x 1.20. Calibration. A model selected on PR-AUC can rank well and still return
  # probabilities that are badly wrong, and this is the line that catches it.
  holdout_brier:
    direction: lower_is_better
    threshold: 0.1981
